name: lint

# These scripts are run as `curl … | bash` and `irm … | iex` by people who are not going to
# read them first. There was no CI at all until this file; the only verification was whoever
# wrote the change running it on their own machine — which for the PowerShell half meant
# nobody, since it is authored on macOS.
#
# That is the gap this closes: GitHub runners have pwsh, so the Windows scripts get parsed and
# analysed on every push for the first time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

      - name: Syntax check every script
        run: |
          fail=0
          for f in scripts/*.sh; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done
          exit $fail

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: sourced files are not present at lint time.
          # SC2016: single-quoted '$…' inside heredocs sent to python is intentional.
          shellcheck --severity=warning --exclude=SC1091,SC2016 scripts/*.sh

  powershell:
    name: powershell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

      - name: Parse every script
        shell: pwsh
        run: |
          # A parse error here is a script that cannot run at all — which is exactly the class
          # of bug that reached a colleague's machine before this job existed.
          $failed = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors.Count) parse error(s)"
              $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "ok  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          # Errors only. These scripts deliberately use Write-Host (they are terminal UX, not
          # pipeline producers) and unapproved verbs, both of which PSScriptAnalyzer warns on.
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          if ($results) { $results | Format-Table -AutoSize; exit 1 }
          Write-Host 'no errors'

  duplication:
    name: duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

      - name: Shared functions must not have drifted
        run: python3 tools/check-duplication.py --diff

      - name: Native commands must be shielded from NativeCommandError
        run: python3 tools/check-powershell-native.py
