name: probe-brew-node
# TEMPORARY - deleted before merge. v5: exact exit codes. v4 showed brew printing a successful
# Summary and Caveats and STILL returning non-zero, which is the whole reason install_node
# aborted. Guessing at why would repeat the mistake; this measures it.
on:
  workflow_dispatch:
  push:
    branches: [fix/node-lts-parity-and-floor]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: State an existing CSA Mac is in
        run: |
          brew uninstall --ignore-dependencies node node@24 node@22 2>/dev/null || true
          hash -r; brew install node >/dev/null 2>&1; hash -r
          npm install -g wrangler >/dev/null 2>&1 || true
          echo "PROBE start: $(node --version) wrangler=$(wrangler --version 2>/dev/null | head -1)"
      - name: Exit codes, step by step
        run: |
          set +e
          brew uninstall --ignore-dependencies node >/dev/null 2>&1
          echo "PROBE uninstall-rc: $?"
          hash -r
          out="$(brew install node@24 2>&1)"; rc=$?
          echo "PROBE install-rc: $rc"
          echo "PROBE install-tail: $(echo "$out" | tail -4 | tr '\n' '|')"
          hash -r
          echo "PROBE which-after-install: $(which node 2>/dev/null || echo NOT-ON-PATH)"
          brew link --overwrite --force node@24 >/dev/null 2>&1
          echo "PROBE link-rc: $?"
          hash -r
          echo "PROBE which-after-link: $(which node 2>/dev/null || echo NOT-ON-PATH)"
          echo "PROBE node-after-link: $(node --version 2>/dev/null || echo FAILED)"
          echo "PROBE wrangler-after: $(wrangler --version 2>/dev/null | head -1 || echo STRANDED)"
          echo "PROBE npm-after: $(npm --version 2>/dev/null || echo FAILED)"
          brew install node@24 >/dev/null 2>&1
          echo "PROBE reinstall-when-present-rc: $?"
