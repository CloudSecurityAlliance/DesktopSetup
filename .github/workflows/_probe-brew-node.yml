name: probe-brew-node
# TEMPORARY - deleted before merge. v3: does switching to node@24 strand npm globals?
# Codex, Gemini and Wrangler are installed with `npm -g`, so where the global prefix lives
# decides whether the LTS switch quietly removes three CLIs from a colleague's Mac.
on:
  workflow_dispatch:
  push:
    branches: [fix/node-lts-parity-and-floor]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Start from the state a CSA Mac is in - unversioned node, with a global package
        run: |
          brew uninstall --ignore-dependencies node node@24 node@22 2>/dev/null || true
          hash -r
          brew install node >/dev/null 2>&1
          hash -r
          npm install -g wrangler >/dev/null 2>&1 || echo "PROBE npm-install-failed"
          hash -r
          echo "PROBE start-node: $(node --version)"
          echo "PROBE start-prefix: $(npm prefix -g)"
          echo "PROBE start-wrangler: $(which wrangler 2>/dev/null || echo MISSING) $(wrangler --version 2>/dev/null | head -1)"
      - name: Install node@24 and force-link it, leaving unversioned node installed
        run: |
          brew install node@24 >/dev/null 2>&1
          brew link --overwrite --force node@24 >/dev/null 2>&1
          hash -r
          echo "PROBE after-node: $(node --version)"
          echo "PROBE after-prefix: $(npm prefix -g)"
          echo "PROBE after-wrangler: $(which wrangler 2>/dev/null || echo STRANDED) $(wrangler --version 2>/dev/null | head -1)"
      - name: And if the unversioned formula is removed entirely
        run: |
          brew uninstall --ignore-dependencies node >/dev/null 2>&1 || echo "PROBE uninstall-failed"
          brew link --overwrite --force node@24 >/dev/null 2>&1
          hash -r
          echo "PROBE final-node: $(node --version 2>/dev/null || echo FAILED)"
          echo "PROBE final-prefix: $(npm prefix -g 2>/dev/null || echo FAILED)"
          echo "PROBE final-wrangler: $(which wrangler 2>/dev/null || echo STRANDED) $(wrangler --version 2>/dev/null | head -1)"
