name: probe-brew-node
# TEMPORARY - deleted before this branch merges. v1 was confounded: the runner image ships
# node@24 already installed AND linked, so "it was on PATH" proved nothing. This starts by
# removing both node formulas to get the state a staff Mac is actually in.
on:
  workflow_dispatch:
  push:
    branches: [fix/node-lts-parity-and-floor]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Clean slate
        run: |
          brew uninstall --ignore-dependencies node node@24 node@22 2>/dev/null || true
          hash -r
          echo "PROBE which-node-after-uninstall: $(which node 2>/dev/null || echo NONE)"
          echo "PROBE formulas: $(brew list --formula 2>/dev/null | grep -E '^node' | tr '\n' ' ' || echo none)"
      - name: Fresh install of keg-only node@24
        run: |
          brew install node@24 >/dev/null 2>&1 || echo "PROBE install-failed"
          hash -r
          echo "PROBE which-node-after-install: $(which node 2>/dev/null || echo 'NOT-ON-PATH')"
          echo "PROBE symlink: $(ls -l /opt/homebrew/bin/node 2>/dev/null || echo 'no /opt/homebrew/bin/node')"
          echo "PROBE prefix-bin: $(ls /opt/homebrew/opt/node@24/bin 2>/dev/null | tr '\n' ' ')"
      - name: Plain brew link (expected to refuse for a keg-only formula)
        run: |
          out="$(brew link node@24 2>&1)"; rc=$?
          echo "PROBE plain-link-rc: $rc"
          echo "PROBE plain-link-out: $(echo "$out" | tr '\n' '|' | cut -c1-200)"
      - name: brew link --overwrite --force
        run: |
          out="$(brew link --overwrite --force node@24 2>&1)"; rc=$?
          hash -r
          echo "PROBE force-link-rc: $rc"
          echo "PROBE which-node-after-force-link: $(which node 2>/dev/null || echo 'NOT-ON-PATH')"
          echo "PROBE node-version: $(node --version 2>/dev/null || echo 'FAILED')"
          echo "PROBE npm-version: $(npm --version 2>/dev/null || echo 'FAILED')"
      - name: Does the unversioned formula then conflict?
        run: |
          brew install node >/dev/null 2>&1 || echo "PROBE node-install-failed"
          hash -r
          echo "PROBE after-installing-unversioned: $(node --version 2>/dev/null || echo FAILED) at $(which node)"
          out="$(brew link --overwrite --force node@24 2>&1)"; rc=$?
          hash -r
          echo "PROBE relink-rc: $rc"
          echo "PROBE after-relink: $(node --version 2>/dev/null || echo FAILED)"
